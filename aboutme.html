  <script>
    const htmlContent = `
      <h2>About Me</h2>
      <p>I, <strong>Shovon Munshi</strong>, am a Naval Architecture and Marine Engineering B.Sc. graduate from Bangladesh University of Engineering and Technology. I led the design of a 1000 DWT inland cargo ship, ensuring compliance with engineering standards while optimizing its performance for Bangladesh’s river routes using AutoCAD, Rhinoceros 3D, Excel, and Maxsurf under the guidance of <i>Prof. Dr. Md. Shahidul Islam</i>. </p>
      <p>My undergraduate thesis research, supervised by <i>Prof. Dr. Zobair ibn Awal</i>, on inland waterway accidents, employed <i>SARIMA, SARIMAX, and HWES models using MATLAB & Python to uncover accident trends and proposed data-driven safety policies</i>, showcasing my passion for blending data analysis with engineering impact.</p>
      <p>I am <strong>interested in research</strong>, with a particular <strong>focus on</strong> <i>data-driven research in engineering system optimization, data analysis and predictive analytics.</i></p>      
      <p>As president of the BUET Origami Club, I organized multiple events, grew membership by 18% in six months, and <i> facilitated collaboration with the Japan Embassy (Bangladesh), </i>honing my leadership skills through collaboration and creativity. In addition to this, I have mentored privately over 10 students preparing for the entrance exams of BUET and DU, with 9 out of 13 succeeding, helping them achieve their academic goals while enhancing my communication skills.</p>
      <p> <strong>I’m excited to connect for opportunities in research, engineering, or collaboration. Reach out via <a href="mailto:munshishovon486@gmail.com">email</a>, <a href="https://www.linkedin.com/in/shovon-munshi-5b1819233/" target="_blank">LinkedIn</a>, or <a href="https://www.facebook.com/shanara.ba.96/" target="_blank">Facebook</a>. </strong></p>
    `;

    const target = document.getElementById("typewriter");
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = htmlContent;
    let nodes = Array.from(tempDiv.childNodes);
    let index = 0;

    function typeNode(node, parent, callback) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        let i = 0;
        const span = document.createElement("span");
        parent.appendChild(span);

        function typeChar() {
          if (i < text.length) {
            span.textContent += text[i++];
            setTimeout(typeChar, 10);
          } else {
            callback();
          }
        }
        typeChar();
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        const clone = document.createElement(node.tagName);
        for (let attr of node.attributes) {
          clone.setAttribute(attr.name, attr.value);
        }
        parent.appendChild(clone);

        const children = Array.from(node.childNodes);
        let j = 0;

        function typeChildren() {
          if (j < children.length) {
            typeNode(children[j++], clone, typeChildren);
          } else {
            callback();
          }
        }
        typeChildren();
      } else {
        callback();
      }
    }

    function typeNextNode() {
      if (index < nodes.length) {
        typeNode(nodes[index++], target, typeNextNode);
      }
    }

    window.addEventListener("DOMContentLoaded", typeNextNode);
  </script>
