  <!-- Favicon and device icons -->

  <!-- Custom styles written by Shovon Munshi -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', monospace;
      background-color: #3e2f23;
      color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: url('shovonmunshi.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    @media (max-width: 600px) {
      body {
        background-image: url('shovonmunshi.webp');
      }
    }

    .container {
      max-width: 850px;
      width: 90%;
      text-align: center;
      background-color: transparent;
    }

    .typing-text {
      font-weight: normal;
      font-size: 4em;
      line-height: 1;
      white-space: pre-line;
      overflow: hidden;
    }

    .cursor::after {
      content: '|';
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    nav {
      margin-top: 20px;
      text-align: center;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      display: inline-block;
      margin-right: 20px;
      position: relative;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      cursor: pointer;
    }

    nav ul li a:hover {
      color: yellow;
      transform: scale(1.1);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      background-color: rgba(0, 0, 0, 0.4);
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      z-index: 999;
      border-radius: 4px;
      top: 100%;
      left: 0;
    }

    .dropdown-menu li {
      display: block;
    }

    .dropdown-menu li a {
      display: block;
      padding: 10px 15px;
      color: white;
      text-decoration: none;
      font-size: 0.95em;
      text-align: left;
    }

    .dropdown-menu li a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .social-links {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 20px;
    }

    .social-links a {
      display: inline-block;
    }

    .social-links img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s;
    }

    .social-links img:hover {
      transform: scale(1.2);
    }

    .footer {
      position: absolute;
      bottom: 0;
      right: 20px;
      font-family: 'Courier New', monospace;
      padding: 10px;
      font-size: 0.9em;
      color: white;
      background-color: transparent;
    }
  </style>
</head>

<body>

        <li><a href="contactme.html">Contact</a></li>

  <!-- Social links -->

  <!-- Scripts: Typing effect and dropdown behavior -->
  <script>
    // Typing animation
    const text = "Shovon Munshi";
    let i = 0;
    const speed = 100;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("text").innerHTML =
          text.substring(0, i + 1) + '<span class="cursor"></span>';
        i++;
        setTimeout(typeWriter, speed);
      } else {
        document.querySelector(".cursor")?.remove();
      }
    }

    function resetTypingAnimation() {
      i = 0;
      document.getElementById("text").innerHTML = '';
      typeWriter();
    }

    window.onload = typeWriter;
    setInterval(resetTypingAnimation, 12000);

    // Dropdown click behavior
    document.addEventListener("DOMContentLoaded", function () {
      const dropdownToggles = document.querySelectorAll(".dropdown-toggle");

      dropdownToggles.forEach(toggle => {
        const dropdown = toggle.closest(".dropdown");

        toggle.addEventListener("click", function (e) {
          e.preventDefault();
          dropdown.classList.toggle("open");
        });

        document.addEventListener("click", function (e) {
          if (!dropdown.contains(e.target)) {
            dropdown.classList.remove("open");
          }
        });
      });
    });
  </script>
